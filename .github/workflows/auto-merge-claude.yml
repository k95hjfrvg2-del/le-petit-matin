name: Merge claude branches into main
on:
  push:
    branches: ["claude/**"]
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward or merge into main
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git checkout main
          git pull origin main
          git merge --no-edit "origin/${GITHUB_REF_NAME}" -X theirs
          git push origin main
          git push origin --delete "${GITHUB_REF_NAME}" || true
